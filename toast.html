<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    -webkit-user-select: none;
  }
  .pill {
    position: relative;
    margin: 6px 8px;
    display: flex; align-items: center; gap: 9px;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 13px; line-height: 18px;
    background: #e6f4ea;
    color: #0b5d1e;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
    white-space: nowrap; overflow: hidden;
    opacity: 0;
    transform: translateY(6px);
    animation-name: toastFade;
    animation-timing-function: ease;
    animation-fill-mode: forwards;
  }
  .pill.bad { background: #fce8e6; color: #8a1d1d; }

  /* 蚂蚁线边框：状态变化时弹出这一条，红/绿都带 */
  .pill::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 10px;
    padding: 2px;
    background: repeating-linear-gradient(90deg, #34a853 0 7px, transparent 7px 14px);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    animation: ants 1.1s linear infinite;
    pointer-events: none;
  }
  .pill.bad::after {
    background: repeating-linear-gradient(90deg, #ea4335 0 7px, transparent 7px 14px);
  }
  @keyframes ants { to { background-position: 14px 0; } }

  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .dot.ok { background: #34a853; }
  .dot.bad { background: #ea4335; }
  .text { overflow: hidden; text-overflow: ellipsis; }
  @keyframes toastFade {
    0%   { opacity: 0; transform: translateY(6px); }
    7%   { opacity: 1; transform: translateY(0); }
    88%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(6px); }
  }
</style>
</head>
<body>
  <div class="pill" id="pill">
    <span class="dot" id="dot"></span>
    <span class="text" id="text"></span>
  </div>
<script>
const params = new URLSearchParams(location.search);
const ok = params.get('ok') === '1';
const text = params.get('text') || '';
const duration = Number(params.get('duration') || 8000);

const pill = document.getElementById('pill');
pill.classList.add(ok ? 'ok' : 'bad');
document.getElementById('dot').classList.add(ok ? 'ok' : 'bad');
document.getElementById('text').textContent = text;
pill.style.animationDuration = duration + 'ms';
</script>
</body>
</html>
