<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    -webkit-user-select: none; cursor: default;
  }
  .pill {
    position: relative;
    margin: 4px 5px;
    height: 32px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 0 10px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.16);
    opacity: 0.92;
    white-space: nowrap;
  }
  /* 蚂蚁线边框 */
  .pill::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 8px;
    padding: 2px;
    background: repeating-linear-gradient(90deg, #34a853 0 7px, transparent 7px 14px);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    animation: ants 1.1s linear infinite;
    pointer-events: none;
  }
  .pill.mid::after { background: repeating-linear-gradient(90deg, #f59e0b 0 7px, transparent 7px 14px); }
  .pill.bad::after { background: repeating-linear-gradient(90deg, #ea4335 0 7px, transparent 7px 14px); }
  @keyframes ants { to { background-position: 14px 0; } }

  .ms { font-size: 13px; line-height: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ms.ok { color: #0b7a3a; }
  .ms.mid { color: #b46b00; }
  .ms.bad { color: #b3261e; }

  .bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
  .bars i { width: 4px; border-radius: 2px; background: #d7dbe0; display: block; }
  .bars i:nth-child(1) { height: 5px; }
  .bars i:nth-child(2) { height: 8px; }
  .bars i:nth-child(3) { height: 11px; }
  .bars i:nth-child(4) { height: 14px; }
  .bars.ok i { background: #34a853; }
  .bars.mid i { background: #f59e0b; }
  .bars.bad i { background: #ea4335; }
  .bars.bad i:nth-child(n+2) { background: #d7dbe0; }
  .bars.mid i:nth-child(n+4) { background: #d7dbe0; }
</style>
</head>
<body>
  <div class="pill ok" id="pill">
    <span class="ms ok" id="ms">-- ms</span>
    <span class="bars ok" id="bars"><i></i><i></i><i></i><i></i></span>
  </div>
<script>
  const pill = document.getElementById('pill');
  const ms = document.getElementById('ms');
  const bars = document.getElementById('bars');

  function setLevel(el, level) {
    el.classList.remove('ok', 'mid', 'bad');
    el.classList.add(level);
  }

  window.setLatency = function (level, text) {
    setLevel(pill, level);
    setLevel(ms, level);
    setLevel(bars, level);
    ms.textContent = text;
  };
</script>
</body>
</html>
